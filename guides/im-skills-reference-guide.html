<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IM Skills Reference Guide</title>
<meta name="description" content="Slash commands and experimental skills for Meltwater Implementation Managers, grouped by workflow.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2328BBBB'/%3E%3Cpath d='M9 16h14M9 10h14M9 22h8' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mw-teal: #28BBBB;
    --mw-teal-medium: #00A7A5;
    --mw-teal-dark: #1C7070;
    --mw-gray: #F0F4F4;
    --mw-black: #1A1A1A;
    --mw-white: #FFFFFF;
    --mw-teal-tint-1: #A3DFDF;
    --mw-teal-tint-2: #C0EBEB;
    --mw-teal-tint-3: #E1EFF0;
    --mw-font: 'Poppins', Arial, sans-serif;
    --mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
    --ink-2: #444B4B;
    --ink-3: #6B7575;
    --line: #DDE6E6;
    --shadow: 0 1px 2px rgba(28,112,112,.08), 0 8px 24px -12px rgba(28,112,112,.22);
    --rail-w: 352px;
    --header-h: 64px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--mw-font);
    color: var(--mw-black);
    background: var(--mw-white);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  :focus-visible { outline: 2.5px solid var(--mw-teal-medium); outline-offset: 2px; border-radius: 6px; }

  .skip-link {
    position: absolute; left: 12px; top: -60px;
    background: var(--mw-teal-dark); color: #fff;
    padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    z-index: 2000; text-decoration: none; transition: top .15s;
  }
  .skip-link:focus { top: 12px; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    height: var(--header-h);
    display: flex; align-items: center; gap: 20px;
    padding: 0 28px;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 14px; color: var(--mw-teal); text-decoration: none; }
  .brand svg { width: 118px; height: auto; display: block; }
  .brand-sep { width: 1px; height: 22px; background: var(--line); }
  .brand-name { font-size: 14px; font-weight: 600; color: var(--mw-black); letter-spacing: -.01em; white-space: nowrap; }

  .search-wrap { position: relative; flex: 1; max-width: 460px; margin-left: auto; }
  .search-box {
    width: 100%;
    padding: 9px 44px 9px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-family: var(--mw-font);
    font-size: 13.5px;
    background: var(--mw-gray);
    color: var(--mw-black);
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .search-box::placeholder { color: var(--ink-3); }
  .search-box:hover { border-color: var(--mw-teal-tint-1); }
  .search-box:focus { border-color: var(--mw-teal); background: #fff; }
  .kbd {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 1px 6px;
    pointer-events: none;
  }
  .menu-btn {
    display: none;
    align-items: center; gap: 8px;
    border: 1.5px solid var(--line); background: #fff; color: var(--mw-teal-dark);
    font-weight: 600; font-size: 13px; padding: 8px 12px; border-radius: 10px; cursor: pointer;
  }
  .menu-btn:hover { background: var(--mw-teal-tint-3); }

  /* ---------- Layout ---------- */
  .shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100dvh - var(--header-h)); }

  .rail {
    position: sticky; top: var(--header-h);
    align-self: start;
    height: calc(100dvh - var(--header-h));
    overflow-y: auto;
    background: var(--mw-gray);
    padding: 18px 14px 28px;
    border-right: 1px solid var(--line);
  }
  .rail-tools { margin-bottom: 4px; }
  .rail-home {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: none; border: 0; text-align: left; cursor: pointer;
    font-size: 15px; font-weight: 600; color: var(--mw-teal-dark);
    padding: 9px 12px; border-radius: 10px;
    transition: background .15s, transform .08s;
  }
  .rail-home:hover { background: var(--mw-teal-tint-3); }
  .rail-home:active { transform: scale(.985); }
  .rail-home[aria-current="page"] { background: #fff; box-shadow: var(--shadow); }
  .gi { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 10px; background: #fff; color: var(--mw-teal-dark); }
  .gi svg { width: 19px; height: 19px; }

  .rail-meta { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 2px; padding: 0 12px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .rail-toggle-all { background: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; color: var(--mw-teal-dark); padding: 5px 9px; margin-right: -9px; border-radius: 7px; transition: background .15s; }
  .rail-toggle-all:hover { background: var(--mw-teal-tint-3); }

  .rail-group { margin-top: 6px; }
  .rail-head {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: none; border: 0; cursor: pointer; text-align: left;
    padding: 9px 12px; border-radius: 10px;
    color: var(--mw-black); font-size: 15.5px; font-weight: 600; letter-spacing: -.005em;
    transition: background .15s, transform .08s;
  }
  .rail-head:hover { background: var(--mw-teal-tint-3); }
  .rail-head:active { transform: scale(.99); }
  .rail-head .gname { flex: 1; }
  .rail-head .count { font-size: 12.5px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rail-head .chev { width: 16px; height: 16px; flex: none; color: var(--ink-3); transition: transform .2s; }
  .rail-group.collapsed .rail-head .chev { transform: rotate(-90deg); }

  .rail-items { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .26s cubic-bezier(.2,.7,.2,1); }
  .rail-items > div { overflow: hidden; min-height: 0; padding-left: 44px; }
  .rail-group.collapsed .rail-items { grid-template-rows: 0fr; }

  .rail-item {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; cursor: pointer;
    padding: 8px 12px; border-radius: 9px;
    transition: background .15s, transform .08s;
  }
  .rail-item:hover { background: var(--mw-teal-tint-3); }
  .rail-item:active { transform: scale(.985); }
  .rail-item[aria-current="page"] { background: #fff; box-shadow: var(--shadow); }
  .rail-cmd { display: block; font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--mw-teal-dark); }
  .rail-title { display: block; font-size: 13px; color: var(--ink-3); margin-top: 1px; line-height: 1.35; }

  .lab-block { margin-top: 22px; background: var(--mw-teal-dark); border-radius: 16px; padding: 8px; }
  .lab-block .rail-head { color: #fff; }
  .lab-block .rail-head:hover { background: rgba(255,255,255,.1); }
  .lab-block .rail-head .count, .lab-block .rail-head .chev { color: var(--mw-teal-tint-2); }
  .lab-block .gi { background: rgba(255,255,255,.14); color: #fff; }
  .tag-xp { background: var(--mw-teal-tint-1); color: var(--mw-teal-dark); padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .lab-block .rail-item:hover { background: rgba(255,255,255,.12); }
  .lab-block .rail-item[aria-current="page"] { background: #fff; }
  .lab-block .rail-cmd { color: #fff; }
  .lab-block .rail-title { color: var(--mw-teal-tint-2); }
  .lab-block .rail-item[aria-current="page"] .rail-cmd { color: var(--mw-teal-dark); }
  .lab-block .rail-item[aria-current="page"] .rail-title { color: var(--ink-3); }
  .lab-intro { font-size: 12.5px; line-height: 1.5; color: var(--mw-teal-tint-2); padding: 0 12px 8px; margin: 0; }

  .rail-empty { font-size: 13px; color: var(--ink-3); padding: 14px 12px; }

  /* ---------- Main pane ---------- */
  main { padding: 34px 56px 72px; min-width: 0; }
  .pane { max-width: 1480px; animation: rise .28s cubic-bezier(.2,.7,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .crumb { font-size: 12.5px; font-weight: 600; color: var(--ink-3); margin: 0 0 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .crumb .pill { background: var(--mw-teal-tint-3); color: var(--mw-teal-dark); padding: 3px 10px; border-radius: 20px; }
  .crumb .pill.xp { background: var(--mw-teal-dark); color: #fff; }

  h1.title { font-size: 38px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; margin: 0 0 6px; text-wrap: balance; }
  .lede { font-size: 16.5px; line-height: 1.6; color: var(--ink-2); margin: 10px 0 0; max-width: 64ch; text-wrap: pretty; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 600; text-decoration: none; cursor: pointer;
    padding: 9px 15px; border-radius: 9px; border: 1.5px solid transparent;
    transition: background .15s, color .15s, border-color .15s, transform .08s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--mw-teal-dark); color: #fff; }
  .btn-primary:hover { background: var(--mw-black); }
  .btn-ghost { background: #fff; color: var(--mw-teal-dark); border-color: var(--mw-teal-tint-1); }
  .btn-ghost:hover { background: var(--mw-teal-tint-3); border-color: var(--mw-teal); }
  .btn[aria-disabled="true"] { background: #fff; color: var(--ink-3); border-color: var(--line); cursor: not-allowed; }
  .btn[aria-disabled="true"]:active { transform: none; }

  .lab-note {
    margin: 22px 0 0; padding: 20px 24px;
    background: var(--mw-teal-tint-3); border-radius: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 28px;
  }
  .lab-note strong { display: block; font-size: 14.5px; color: var(--mw-teal-dark); margin-bottom: 4px; }
  .lab-note p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink-2); max-width: 92ch; }
  .lab-note .actions { flex: none; }

  .callout { display: flex; gap: 16px; align-items: flex-start; margin: 14px 0 0; padding: 18px 22px; background: #fff; border: 2px solid var(--mw-teal-dark); border-radius: 16px; }
  .callout-ic { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--mw-teal-dark); color: #fff; font-weight: 700; font-size: 15px; display: grid; place-items: center; margin-top: 1px; }
  .callout strong { display: block; font-size: 15.5px; color: var(--mw-teal-dark); margin-bottom: 4px; }
  .callout p { margin: 0; font-size: 14.5px; line-height: 1.65; color: #262B2B; max-width: 90ch; }

  .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 64px; align-items: start; margin-top: 30px; }
  .col-main .block:first-child { margin-top: 0; }
  .col-side { position: sticky; top: calc(var(--header-h) + 24px); display: flex; flex-direction: column; gap: 14px; }
  .side-card { background: var(--mw-gray); border-radius: 16px; padding: 18px 20px 20px; }
  .side-card h2 { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mw-teal-dark); margin: 0 0 12px; }

  .cmd-stack { display: flex; flex-direction: column; gap: 8px; }
  .cmd-chip {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    font-family: var(--mono); font-size: 13.5px; font-weight: 600; color: var(--mw-teal-dark);
    background: #fff; border: 1.5px solid var(--mw-teal-tint-2); padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left;
    transition: border-color .15s, background .15s, transform .08s;
  }
  .cmd-chip:hover { border-color: var(--mw-teal); background: var(--mw-teal-tint-3); }
  .cmd-chip:active { transform: scale(.985); }
  .cmd-chip .cmd-text { overflow-wrap: anywhere; }
  .cmd-chip .cp { font-family: var(--mw-font); font-size: 11.5px; font-weight: 600; color: var(--ink-3); flex: none; }

  .block { margin-top: 34px; }
  .block h2 { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mw-teal-dark); margin: 0 0 10px; }
  .block p { font-size: 16.5px; line-height: 1.7; margin: 0; max-width: 80ch; color: #262B2B; text-wrap: pretty; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 12.5px; font-weight: 500; background: #fff; color: var(--ink-2); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--line); }

  .example { font-family: var(--mono); font-size: 12.5px; line-height: 1.55; background: var(--mw-gray); border-radius: 10px; padding: 12px 14px; overflow-wrap: anywhere; color: #262B2B; max-width: 80ch; }

  .schedule { margin-top: 44px; background: var(--mw-teal-tint-3); border-radius: 18px; padding: 24px 28px 26px; }
  .schedule-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .schedule-head h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mw-teal-dark); }
  .cadence { font-size: 12px; font-weight: 700; background: var(--mw-teal-dark); color: #fff; padding: 4px 11px; border-radius: 20px; }
  .schedule > p { font-size: 14.5px; line-height: 1.6; margin: 0 0 14px; color: var(--ink-2); max-width: 90ch; }
  .prompt {
    font-family: var(--mono); font-size: 12.5px; line-height: 1.65; color: #262B2B;
    background: #fff; border: 1px solid var(--mw-teal-tint-2); border-radius: 12px;
    padding: 16px 18px; margin: 0 0 14px; max-height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }

  .links { display: flex; gap: 10px; flex-wrap: wrap; }
  .pair-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
    font-family: var(--mono); font-size: 13.5px; font-weight: 600; color: var(--mw-teal-dark);
    background: #fff; border: 1.5px solid var(--mw-teal-tint-2); padding: 10px 12px; border-radius: 10px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .pair-btn:hover { border-color: var(--mw-teal); background: var(--mw-teal-tint-3); }

  /* ---------- Home ---------- */
  .home-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; margin-top: 30px; }
  .step { border-radius: 18px; padding: 26px 28px; }
  .step.install { background: var(--mw-teal-dark); color: #fff; }
  .step.connect { background: #fff; border: 1.5px solid var(--mw-teal-tint-2); }
  .step .label { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
  .step.install .label { color: var(--mw-teal-tint-1); }
  .step.connect .label { color: var(--mw-teal-dark); }
  .step p { font-size: 14.5px; line-height: 1.6; margin: 0 0 18px; max-width: 58ch; }
  .step.install p { color: var(--mw-teal-tint-2); }
  .step.connect p { color: var(--ink-2); }
  .step .btn-cta { background: var(--mw-teal); color: #fff; }
  .step .btn-cta:hover { background: #fff; color: var(--mw-teal-dark); }
  .step.connect .chip { background: var(--mw-teal-tint-3); color: var(--mw-teal-dark); font-weight: 600; border-color: transparent; }

  .home-cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 48px; align-items: start; margin-top: 12px; }
  .home-h { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mw-teal-dark); margin: 34px 0 8px; }
  .wf { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .wf li { border-bottom: 1px solid var(--line); }
  .wf button {
    display: grid; grid-template-columns: 44px minmax(0, 1.1fr) minmax(0, 1.2fr) auto; gap: 16px; align-items: center;
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: 14px 10px;
    transition: background .15s;
  }
  .wf button:hover { background: var(--mw-gray); }
  .wf-ic { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--mw-teal-tint-3); color: var(--mw-teal-dark); }
  .wf-ic svg { width: 22px; height: 22px; }
  .wf .g { font-size: 15.5px; font-weight: 600; }
  .wf .g .sub { display: block; font-weight: 400; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .wf .cmds { font-family: var(--mono); font-size: 12.5px; color: var(--mw-teal-dark); line-height: 1.65; }
  .wf .n { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .lab-promo { margin-top: 34px; background: var(--mw-teal-tint-3); border-radius: 18px; padding: 24px 26px; position: sticky; top: calc(var(--header-h) + 24px); }
  .lab-ic { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--mw-teal-dark); color: #fff; margin-bottom: 14px; }
  .lab-ic svg { width: 24px; height: 24px; }
  .lab-promo h3 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.01em; }
  .lab-promo p { margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: var(--ink-2); }
  .btn-cta2 { background: var(--mw-teal-dark); color: #fff; border: 0; }
  .btn-cta2:hover { background: var(--mw-black); }

  .no-results { font-size: 14px; color: var(--ink-3); }

  footer.page-foot {
    margin: 56px 0 0; font-size: 12px; line-height: 1.6; color: var(--ink-3);
    border-top: 1px solid var(--line); padding-top: 16px;
  }
  .relock { background: none; border: none; color: #A0A8A8; font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; margin-top: 6px; }
  .relock:hover { color: var(--ink-3); }

  /* ---------- Password gate (unchanged behavior) ---------- */
  #pageContent { display: none; }
  html.unlocked #pageContent { display: block; }
  html.unlocked #passwordGate { display: none; }

  #passwordGate {
    position: fixed; inset: 0; background: var(--mw-teal-dark);
    display: flex; align-items: center; justify-content: center; z-index: 3000; padding: 20px;
  }
  .gate-card {
    background: var(--mw-white); border-radius: 16px; padding: 36px 32px;
    max-width: 360px; width: 100%; text-align: center; box-shadow: 0 18px 50px rgba(10,50,50,.35);
  }
  .gate-card .eyebrow {
    display: inline-block; background: var(--mw-teal-tint-3); color: var(--mw-teal-dark);
    font-weight: 600; font-size: 12px; letter-spacing: .03em; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px;
  }
  .gate-card h2 { font-size: 19px; font-weight: 700; margin: 6px 0 6px; letter-spacing: -.01em; }
  .gate-card p { font-size: 13px; color: #666; margin: 0 0 18px; line-height: 1.5; }
  .gate-card input {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--mw-teal-tint-2); border-radius: 9px;
    font-family: var(--mw-font); font-size: 14px; outline: none; margin-bottom: 10px; transition: border-color .15s;
  }
  .gate-card input:focus { border-color: var(--mw-teal); }
  .gate-card button {
    width: 100%; padding: 11px 12px; background: var(--mw-teal-dark); color: #fff; border: none; border-radius: 9px;
    font-family: var(--mw-font); font-weight: 600; font-size: 14px; cursor: pointer; transition: background .15s, transform .08s;
  }
  .gate-card button:hover { background: var(--mw-black); }
  .gate-card button:active { transform: scale(.98); }
  .gate-error { display: none; color: #C62828; font-size: 12.5px; margin-top: 10px; }
  .gate-card .gate-hint { font-size: 12px; color: #999; margin: 14px 0 0; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1180px) {
    main { padding: 30px 32px 64px; }
    .detail-grid { grid-template-columns: 1fr; gap: 28px; }
    .col-side { position: static; flex-direction: row; flex-wrap: wrap; }
    .col-side .side-card { flex: 1 1 260px; }
    .home-cols { grid-template-columns: 1fr; gap: 0; }
    .lab-promo { position: static; }
    .lab-note { flex-direction: column; align-items: flex-start; gap: 16px; }
  }
  @media (max-width: 900px) {
    .topbar { padding: 0 16px; gap: 12px; }
    .brand-sep, .brand-name { display: none; }
    .brand svg { width: 96px; }
    .menu-btn { display: inline-flex; }
    .search-wrap { max-width: none; margin-left: 0; }
    .kbd { display: none; }
    .shell { grid-template-columns: 1fr; }
    .rail {

<script>

  const PLUGIN_URL = "https://claude.ai/directory/plugins/implementation-manager-toolkit%40meltwater%2Fmeltwater-im-plugins";

  const GROUPS = [
    { id: "daily",     icon: "i-daily",     name: "Daily rhythm",       blurb: "Start the day knowing what needs you." },
    { id: "portfolio", icon: "i-portfolio", name: "Portfolio and data", blurb: "See the whole book of onboardings." },

  const SKILLS = [
    {
      id: "daily-brief", group: "daily", command: "/daily-brief", title: "Daily brief",
      whenToUse: "First thing in the morning, or the night before to get ahead of tomorrow. Say “daily brief,” “prep me for today,” “what's on my plate today,” “morning prep,” or “what do I need to know for tomorrow.” Asking about another day only changes the meetings list. Everything else always reflects today's live state.",
      output: "A two-minute scan in three parts, always in this order. First, outstanding items: unanswered customer emails, Slack DMs, and asks in client channels, with how many business days each has waited. Second, that day's client meetings, each with usage health, days in onboarding, and blended objective progress. Third, a capped list of 3–5 proactive flags, filled in priority order: aging with poor health, poor health, aging, then missing champion. It shows fewer when fewer qualify. It closes by offering, never auto-running, /meeting-prep for the day's calls and /my-portfolio-snapshot for the full adoption view.",
      requires: ["Gmail", "Slack", "Google Calendar", "Google Drive", "Snowflake Agent MCP"],
      shareUrl: "https://claude.ai/customize/skills?selectedId=skill_01Utq3pzW6CDV4RvtPxS13mW",
      schedule: {
        cadence: "Daily at 7:00 AM",
        note: "Runs the full brief every morning, then DMs you just the top 3 things to know — the full brief stays in that conversation if you want to look deeper.",
        prompt: "Every day at 7:00 AM, run /daily-brief. From the Outstanding Items, Meetings, and Proactive Items sections, pull out the 3 most important things I need to know today — one tight line each, ranked by urgency. Send me a Slack DM (not a channel post) with just those 3 items. Keep the full brief in this conversation in case I want to open it and look deeper, but the DM itself should be short enough to read in a few seconds."
      }
    },
    {
      id: "release-radar", group: "daily", command: "/release-radar", title: "Release radar",
      whenToUse: "Anytime you want to catch up on product releases without reading every Slack post. Say “catch me up on releases,” “what's new I should know about,” “what did product ship this week,” or “did anything ship that affects [customer].” Give it a window like “this week” or “since the [customer] call.” With no window, it looks back 14 days.",
      output: "A ranked digest of the Product Marketing release channel, not a filtered one: everything that shipped still shows up, sorted into “Came up with a customer,” “Worth knowing,” and “Lower priority / skim.” Ranking starts from how onboarding actually works, with product tier and Product Marketing's L1/L2/L3 rating as tie-breakers. Every release links to its Slack post. Anything that already surfaced in your Gmail or a Gong call summary in the last 30 days is flagged with the customer and where it came up. Weekly recap posts are split into individual releases, and explainer videos for existing features are skipped.",
      requires: ["Slack", "Gmail"],
      shareUrl: "https://claude.ai/customize/skills?selectedId=skill_01AAJesnrXJr1bWzJWdGP4J3",
      schedule: {
        cadence: "Every other Friday",
        note: "A biweekly cadence lines up with the skill's own 14-day default window. DMs a one-line heads-up — not the full digest — so you know when it's worth opening.",
        prompt: "Every other Friday, run /release-radar. Count how many releases landed in the “Came up with a customer” band — those are the ones already flagged because they came up with a specific customer in email or on a call. Send me a Slack DM (not a channel post) that just says something like: “Your release radar is ready — you have [X] clients who may appreciate an outreach.” Keep the full ranked digest in this conversation so I can open it and see the detail — which customers, which releases, and why."
      }
    },
    {
      id: "my-portfolio-snapshot", group: "portfolio", command: "/my-portfolio-snapshot", title: "Portfolio snapshot",
      whenToUse: "Anytime you want a quick read on your whole book of active onboardings. Say “my portfolio,” “show me my accounts,” “portfolio snapshot,” “my active onboardings,” or “how do my accounts look.” It always shows your own accounts.",
      output: "Two scannable tables: your main portfolio, and a separate Digital Onboardings table for Quick Start accounts (left out if you have none). Each row shows days in onboarding, segment, account health, usage health, and green/yellow/red adoption across Explore, Media Relations, GenAI Lens, Klear, MIRA, and Newsletter, with a dash for any product the account didn't buy. The population includes expansion and upsell onboardings that Totango's default filters drop. The data runs 1–2 days behind the Totango UI because of the nightly sync.",
      requires: ["Snowflake Agent MCP"],
      shareUrl: "https://claude.ai/customize/skills?selectedId=skill_01RqwVxLXMZ35eDtA5qBy3an"
    },
    {
      id: "totango-agent", group: "portfolio", command: "/totango-agent", title: "Totango agent",
      whenToUse: "Mostly runs quietly behind the scenes inside the other skills, so you don't need to call it for everyday work. Worth knowing about if you want to ask Totango a one-off question (“pull active onboardings,” “show me [IM]’s portfolio,” “which accounts are on hold,” “aging onboardings,” “is there a champion on this account”), or if you're building your own skill on top of it. It scopes to your own accounts by default, and team leads and area leaders can widen that.",
      output: "Live answers on onboarding data: stage breakdowns, aging and at-risk accounts, usage and health scores, product adoption, and champion flags. Champions come back as yes/no unless you ask who, and then it looks up a name. It applies Meltwater's own definitions of “in onboarding” and “days in onboarding,” which override the agent's defaults. Those defaults quietly drop most expansion and upsell onboardings. Aging is measured against segment targets: SMB 30 days, Mid-Market 45 (60 above $80k ACV), and Enterprise 60 below $100k ACV, with longer windows above that. This is the same data layer /meeting-prep, /daily-brief, and /my-portfolio-snapshot call internally.",
      requires: ["Snowflake Agent MCP"],
      shareUrl: "https://claude.ai/customize/skills?selectedId=skill_01CBfEW4eNX3q3SJ4ZtkUbeL"
    },
    {
      id: "meeting-prep", group: "calls", command: "/meeting-prep", title: "Meeting prep",
      whenToUse: "Before any customer call. Say “prep me for my call with [customer],” “prep me for my next call,” or “help me prep for my 2pm.” No customer named? It finds your next customer meeting on the calendar. It works out the meeting type (Kickoff, Product Training, Follow-Up/Q&A, or Onboarding Closure) from the event title, your wording, the onboarding stage, and call history, and only asks you if it's still unclear.",
      output: "An inline prep brief shaped by meeting type. Every brief opens with an account snapshot: usage and overall health, days in onboarding against the segment target, stage, segment, ACV, products, champion, and risk flags. Training, follow-up, and closure briefs add attendee product usage, green/yellow/red adoption for purchased products, objective progress mapped against the presales discovery notes, a last-call recap from Gong's summary email (the Gong agent is a fallback when there isn't one), and recent email activity. Kickoff briefs swap those for the kickoff deck and presales context from the customer's Vault folder. Every brief ends with 3–5 prioritized talking points.",
      requires: ["Google Calendar", "Gmail", "Google Drive", "Snowflake Agent MCP"],
      shareUrl: "https://claude.ai/customize/skills?selectedId=skill_01QwkfEy5ri5dgnEyiereFws"
    },
    {
      id: "kickoff-helper", group: "calls", command: "/kickoff-helper", title: "Kickoff helper",
      whenToUse: "Right after you run a customer kickoff call. Say “run kickoff helper for [customer],” “help me follow up on my kickoff call with [customer],” or “I just had a kickoff call with [customer].” It finds the account and pulls the call transcript from Gong for you.",
      output: "Four things from the call transcript. One: Totango-ready onboarding objectives, with Outcome Milestones mapped to the official first-impact taxonomy. Two: next steps tagged by owner, either email content or an action for you, plus above-and-beyond ideas. Three: private coaching notes that only you see. Four: a client-ready follow-up email, drafted last. Before it drafts the email, it checks whether any of your own actions should happen first. The email states goals in “by the end of onboarding, you'll be able to” form, lists the customer's next steps, links community resources, and covers the next meeting. North America accounts get the weekly new-user webinar if it came up on the call.",
      requires: ["Google Calendar", "Snowflake Agent MCP", "Google Drive (optional)"],
      shareUrl: "https://claude.ai/customize/skills?selectedId=skill_01XBgK3ouvvyXELa1qTPPsGd"
    },
    {
      id: "client-vault-helper", group: "new", command: "/client-vault-helper", title: "Client vault helper",
      whenToUse: "Right after you get assigned a new account. Paste the routing thread link, or give the customer name and it finds the thread. It handles both routing channels: #gold_nam_onboarding_routing for Standard and Advanced accounts, built from VoCAgent's brief, and ebu_nam_routing for Enterprise, built from the sales rep's scoping doc with VoCAgent only as a fallback. If an Enterprise scoping doc is a Word file, it stops and asks you for a Google Doc link or an upload rather than guessing.",
      output: "Three things, in this order: a JSON setup payload for the vault creator web app (client name, team roles, three drafted kickoff goals, and the presales summary), a Totango Plan Summary block, and a briefing that ends with what to double-check. It only prepares the input. It doesn't create the folder, touch the deck, or write to Totango, and subscription details like seat counts and entitlements aren't covered yet.",
      example: "/client-vault-helper https://meltwater.slack.com/archives/C03UPUHLGMT/p1786471010882019",
      requires: ["Slack", "Google Drive (Enterprise)"],
      shareUrl: "https://claude.ai/customize/skills?selectedId=skill_018cQ15iE1cvU9DmFAcHKRDo"
    },
    {
      id: "genai-lens-onboarding", group: "new", command: "/genai-lens-onboarding", title: "GenAI Lens prompt set",
      whenToUse: "When a customer is being onboarded onto GenAI Lens and needs a prompt set. It starts by asking whether the customer already has questions or an export to carry over. Mention GenAI Lens, ask to build prompts for a customer, or ask for prompts about their competitors, trending topics, or brand reputation, even without naming the skill.",
      output: "A filled GenAI Lens spreadsheet named for the customer, plus a short summary. Prompts are grouped by type: “be the answer” recommendation questions, natural-voice competitor comparisons, trending and reputation topics, and due-diligence questions, with extra types added when the research points somewhere new. They're written the way people actually type into an LLM, not corporate-speak, and prompts likely to surface cited sources are flagged. Existing customer questions can be migrated as-is. The summary covers why each type was used, where the grounding came from, which news event each trending prompt is tied to, and any assumptions. It's always flagged back to you for review before it ships. Sending the prompts to LLM providers is handled by GenAI Lens itself, not this skill.",
      requires: [], shareUrl: ""
    },

  const CONNECTORS = ["Snowflake Agent MCP", "Gmail", "Google Calendar", "Google Drive", "Slack", "Meltwater Internal"];

  /* ===================== Rendering ===================== */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (v) => { const d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; };
  const byId = Object.fromEntries(SKILLS.map(s => [s.id, s]));
  const groupName = (g) => (GROUPS.find(x => x.id === g) || {}).name || '';

  const rail = $('#rail');
  const main = $('#main');
  const searchBox = $('#searchBox');
  let query = '';

  /* Collapsed state for rail sections. Default: everything expanded. */
  const COLLAPSE_KEY = 'mw_im_guide_collapsed';
  let collapsed = {};
  try { collapsed = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}') || {}; } catch (e) { collapsed = {}; }
  const saveCollapsed = () => { try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); } catch (e) {} };

  const icon = (id, cls = '') => `<svg class="${cls}" aria-hidden="true" focusable="false"><use href="#${id}"/></svg>`;
  const CHEV = `<svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function haystack(s) {
    return [s.command, s.title, s.whenToUse, s.output, (s.requires || []).join(' '), s.lab ? 'skills lab experimental' : groupName(s.group)].join(' ').toLowerCase();
  }
  function matches(s) {
    const q = query.trim().toLowerCase();
    return !q || q.split(/\s+/).every(w => haystack(s).includes(w));
  }

  function railItem(s, current) {
    return `<button class="rail-item" data-go="${esc(s.id)}" ${current === s.id ? 'aria-current="page"' : ''}>
      <span class="rail-cmd">${esc(s.railCommand || s.command)}</span>
      <span class="rail-title">${esc(s.title)}</span>
    </button>`;
  }

  function section(id, name, iconId, count, innerHtml, isCollapsed, extraClass = '', badge = '') {
    return `<div class="rail-group ${extraClass} ${isCollapsed ? 'collapsed' : ''}" data-group="${esc(id)}">
      <button class="rail-head" data-toggle="${esc(id)}" aria-expanded="${!isCollapsed}" aria-controls="grp-${esc(id)}">
        <span class="gi">${icon(iconId)}</span>
        <span class="gname">${esc(name)}</span>${badge}
        <span class="count">${count}</span>${CHEV}
      </button>
      <div class="rail-items" id="grp-${esc(id)}"><div ${isCollapsed ? 'inert' : ''}>${innerHtml}</div></div>
    </div>`;
  }

  function currentGroupOf(id) { const s = byId[id]; return s ? (s.lab ? 'lab' : s.group) : null; }

  function drawRail(current) {
    const searching = !!query.trim();
    const live = SKILLS.filter(s => !s.lab && matches(s));
    const lab = SKILLS.filter(s => s.lab && matches(s));
    const isCol = (id) => !searching && !!collapsed[id];

    let html = `<div class="rail-tools">
      <button class="rail-home" data-go="home" ${current === 'home' ? 'aria-current="page"' : ''}>
        <span class="gi">${icon('i-start')}</span><span>Getting started</span>
      </button>
    </div>`;
    const anyOpen = GROUPS.concat([{ id: 'lab' }]).some(g => !collapsed[g.id]);
    html += `<div class="rail-meta"><span>Skills by workflow</span><button class="rail-toggle-all" data-toggle-all>${anyOpen ? 'Collapse all' : 'Expand all'}</button></div>`;

    GROUPS.forEach(g => {
      const items = live.filter(s => s.group === g.id);
      if (!items.length) return;
      html += section(g.id, g.name, g.icon, items.length, items.map(s => railItem(s, current)).join(''), isCol(g.id));
    });

    if (lab.length || !searching) {
      html += section('lab', 'Skills Lab', 'i-lab', lab.length,
        `<p class="lab-intro">Skills to try. Most aren't in the plugin yet.</p>${lab.map(s => railItem(s, current)).join('')}`,
        isCol('lab'), 'lab-block', '<span class="tag-xp">Experimental</span>');
    }
    if (searching && !live.length && !lab.length) html += `<p class="rail-empty">No skills match that search.</p>`;
    rail.innerHTML = html;
  }

  function setGroupState(el, isCollapsed) {
    const id = el.dataset.group;
    el.classList.toggle('collapsed', isCollapsed);
    $('.rail-head', el).setAttribute('aria-expanded', String(!isCollapsed));
    const inner = $('.rail-items > div', el);
    if (isCollapsed) inner.setAttribute('inert', ''); else inner.removeAttribute('inert');
    if (isCollapsed) collapsed[id] = true; else delete collapsed[id];
    saveCollapsed();
  }

  function refreshToggleAll() {
    const btn = $('[data-toggle-all]');
    if (!btn) return;
    const els = [...rail.querySelectorAll('.rail-group')];
    btn.textContent = els.some(e => !e.classList.contains('collapsed')) ? 'Collapse all' : 'Expand all';
  }

  function chips(list) { return list.length ? `<div class="chips">${list.map(r => `<span class="chip">${esc(r)}</span>`).join('')}</div>` : ''; }

  function footer() {

      Review AI output before acting on it — outputs are a starting point, not a final decision. Log any AI-informed decision in CRM/ticket per standard practice.<br>

    const wf = GROUPS.map(g => {

      return `<li><button data-go="${esc(items[0].id)}">

        <span class="n">${items.length} ${items.length === 1 ? 'skill' : 'skills'}</span></button></li>`;

    const labCount = SKILLS.filter(s => s.lab).length;
    main.innerHTML = `<div class="pane">
      <p class="crumb"><span class="pill">Claude for IMs</span></p>
      <h1 class="title">IM skills quick reference</h1>
      <p class="lede">Slash commands for your Claude workflow, grouped by what you're doing. Pick a skill on the left to see when to use it, what it hands back, and what it needs.</p>
      <div class="home-steps">
        <div class="step install">
          <div class="label">Step 1 · Install the plugin</div>

          <a class="btn btn-cta" href="${PLUGIN_URL}" target="_blank" rel="noopener">Install the Implementation Manager Toolkit →</a>
        </div>
        <div class="step connect">
          <div class="label">Step 2 · Connect these tools first</div>
          <p>The plugin won't work without these connected. Check each one is set up in your Claude connectors before running any skill.</p>
          <div class="chips">${CONNECTORS.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>
        </div>
      </div>
      <div class="home-cols">
        <div>
          <h2 class="home-h">Browse by workflow</h2>
          <ul class="wf">${wf}</ul>
        </div>
        <div class="lab-promo">
          <span class="lab-ic">${icon('i-lab')}</span>
          <h3>Skills Lab</h3>
          <p>${labCount} skills to try out. Most are experimental and aren't in the plugin yet. Each has its own link: add it to your Claude and you'll get updates as it improves.</p>
          <button class="btn btn-cta2" data-go="${esc(SKILLS.find(s => s.lab).id)}">Explore the Lab →</button>
        </div>
      </div>
      ${footer()}
    </div>`;
  }

  function renderSkill(s) {
    const crumbs = s.lab
      ? `<span class="pill xp">Skills Lab</span><span>${s.inPlugin ? 'Already in the plugin · kept in the Lab for now' : 'Experimental · not in the plugin'}</span>`
      : `<span class="pill">${esc(groupName(s.group))}</span>`;

    const labBlock = s.lab ? (s.inPlugin ? `
      <div class="lab-note">
        <div class="lab-note-copy">
          <strong>Already in the plugin</strong>
          <p>If you've installed the Implementation Manager Toolkit, you already have this skill, so there's nothing separate to add. It's listed in the Lab for now while it's still being tuned, and updates arrive through the plugin. Tell Marty what works and what doesn't.${s.note ? ' ' + esc(s.note) : ''}</p>
        </div>
        <div class="actions"><a class="btn btn-primary" href="${PLUGIN_URL}" target="_blank" rel="noopener">Get the plugin →</a></div>
      </div>` : `
      <div class="lab-note">
        <div class="lab-note-copy">
          <strong>Add this to your Claude</strong>
          <p>This skill lives outside the plugin. Add it with its own link and Claude will keep it updated for you. It's early, so expect a few rough edges, and tell Marty what works and what doesn't.${s.note ? ' ' + esc(s.note) : ''}</p>
        </div>
        <div class="actions">
          ${s.addUrl
            ? `<a class="btn btn-primary" href="${esc(s.addUrl)}" target="_blank" rel="noopener">Add to Claude →</a>`
            : `<span class="btn" aria-disabled="true">Link coming soon</span>`}
        </div>
      </div>`) : '';

    const callout = s.callout ? `
      <div class="callout" role="note">
        <span class="callout-ic" aria-hidden="true">!</span>
        <div><strong>${esc(s.callout.title)}</strong><p>${esc(s.callout.text)}</p></div>
      </div>` : '';

    const cmds = s.command.split(' · ').map(c => `<button class="cmd-chip" data-copy-text="${esc(c)}" aria-label="Copy ${esc(c)}"><span class="cmd-text">${esc(c)}</span><span class="cp">Copy</span></button>`).join('');

    const links = [];
    if (!s.lab && s.shareUrl) links.push(`<a class="btn btn-ghost" href="${esc(s.shareUrl)}" target="_blank" rel="noopener">View in Claude ↗</a>`);
    if (s.resource) links.push(`<a class="btn btn-ghost" href="${esc(s.resource.url)}" target="_blank" rel="noopener">${esc(s.resource.label)} ↗</a>`);

    const sched = s.schedule ? `

        <div class="schedule-head"><h2 id="sched-h">Recommended schedule</h2><span class="cadence">${esc(s.schedule.cadence)}</span></div>
        <p>${esc(s.schedule.note)}</p>
        <pre class="prompt" id="prompt-${esc(s.id)}">${esc(s.schedule.prompt)}</pre>
        <button class="btn btn-ghost" data-copy="prompt-${esc(s.id)}">Copy prompt</button>
      </section>` : '';

    const pair = s.companion && byId[s.companion]
      ? `<div class="side-card"><h2>Pairs with</h2><button class="pair-btn" data-go="${esc(s.companion)}">${esc(byId[s.companion].command)}<span aria-hidden="true">→</span></button></div>` : '';

    main.innerHTML = `<article class="pane">
      <p class="crumb">${crumbs}</p>
      <h1 class="title">${esc(s.title)}</h1>
      ${labBlock}
      ${callout}
      <div class="detail-grid">
        <div class="col-main">
          <section class="block"><h2>When to use</h2><p>${esc(s.whenToUse)}</p></section>
          <section class="block"><h2>What you get</h2><p>${esc(s.output)}</p></section>
          ${s.example ? `<section class="block"><h2>Example</h2><div class="example">${esc(s.example)}</div></section>` : ''}
        </div>
        <aside class="col-side" aria-label="Skill details">
          <div class="side-card"><h2>${s.command.includes(' · ') ? 'Commands' : 'Command'}</h2><div class="cmd-stack">${cmds}</div></div>
          ${s.requires && s.requires.length ? `<div class="side-card"><h2>Needs</h2>${chips(s.requires)}</div>` : ''}
          ${links.length ? `<div class="side-card"><h2>Open</h2><div class="links">${links.join('')}</div></div>` : ''}
          ${pair}
        </aside>
      </div>
      ${sched}
      ${footer()}
    </article>`;
  }

  function route() {
    const id = decodeURIComponent((location.hash || '#home').slice(1)) || 'home';
    const s = byId[id];
    const current = s ? id : 'home';
    // Make sure the section holding the open skill is expanded so you can see where you are.
    const g = currentGroupOf(current);
    if (g && collapsed[g]) { delete collapsed[g]; saveCollapsed(); }
    s ? renderSkill(s) : renderHome();
    drawRail(current);
    document.title = (s ? s.command.split(' · ')[0] + ' · ' : '') + 'IM Skills Reference Guide';
    document.body.classList.remove('rail-open');
    $('#menuBtn').setAttribute('aria-expanded', 'false');
  }

  function go(id) {
    if (location.hash === '#' + id) { route(); } else { location.hash = id; }
    window.scrollTo({ top: 0 });
    main.focus({ preventScroll: true });
  }

  function copyText(text, btn) {
    const label = $('.cp', btn) || btn;
    const original = label.textContent;
    const done = (msg) => { label.textContent = msg; setTimeout(() => { label.textContent = original; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done('Copied'), () => done('Select and copy'));
    } else { done('Select and copy'); }
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-go],[data-copy],[data-copy-text],[data-relock],[data-toggle],[data-toggle-all]');
    if (!t) return;
    if (t.dataset.go) go(t.dataset.go);
    else if (t.dataset.copy) copyText($('#' + t.dataset.copy).textContent, t);
    else if (t.dataset.copyText) copyText(t.dataset.copyText, t);
    else if (t.dataset.toggle) {
      const el = t.closest('.rail-group');
      setGroupState(el, !el.classList.contains('collapsed'));
      refreshToggleAll();
    }
    else if (t.hasAttribute('data-toggle-all')) {
      const els = [...rail.querySelectorAll('.rail-group')];
      const collapse = els.some(x => !x.classList.contains('collapsed'));
      els.forEach(x => setGroupState(x, collapse));
      refreshToggleAll();
    }
    else if (t.hasAttribute('data-relock')) {
      try { localStorage.removeItem('mw_im_guide_unlocked'); } catch (err) {}
      document.documentElement.classList.remove('unlocked');
    }
  });

  searchBox.addEventListener('input', (e) => {
    query = e.target.value;
    const id = (location.hash || '#home').slice(1);
    drawRail(byId[id] ? id : 'home');
  });
  searchBox.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { searchBox.value = ''; query = ''; searchBox.blur(); route(); }
    if (e.key === 'Enter') {
      const first = SKILLS.find(matches);
      if (first && query.trim()) go(first.id);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); searchBox.focus(); }
  });

  $('#menuBtn').addEventListener('click', () => {
    const open = document.body.classList.toggle('rail-open');
    $('#menuBtn').setAttribute('aria-expanded', String(open));
  });

  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
